; Remokey 配置文件(必须与 remokey.exe 位于同一目录下)

[server]
address = 0.0.0.0

; 1-65535
port = 8888

[input]
; 文本输入方式（大小写不敏感）：
;
;   wm_char   - 通过 WM_CHAR 消息直接投递字符，绕过 IME 与键盘事件链（默认）
;               优点：稳定，搜狗/微软拼音/英文输入法表现一致；Chromium无丢字
;               缺点：不触发 keydown/keypress，输入联想/实时校验可能不工作；
;                     游戏/DirectInput 自绘控件不响应; Remokey实时模式下会存在Bug，建议配合 草稿模式使用。
;
;   sendinput - 通过 SendInput(KEYEVENTF_UNICODE) 注入键盘事件，经过 IME
;               优点：触发完整事件链，兼容游戏/自绘控件
;               缺点：微软拼音在 Chromium等 TSF 客户端上可能丢字
;                     或把汉字替换成逗号/句号
;
; 若省略本段或本键，程序默认使用 wm_char。
mode = wm_char
